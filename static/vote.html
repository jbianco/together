<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f5fa">
<title>Together · Join</title>
<style>
  :root {
    --bg: #f5f5fa; --card: #ffffff; --ink: #25233b; --muted: #6f6d86; --line: #e7e6f0;
    --accent: #6d66f0; --accent-ink: #3f38c4; --accent-soft: #eeedff;
    --calm: #2a9d8f; --calm-soft: #e2f3f0; --amber: #d9a03a; --err: #b5473a;
    --shadow: 0 1px 2px rgba(37, 35, 59, .04), 0 8px 24px rgba(37, 35, 59, .06);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); font-size: 17px; line-height: 1.45;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: radial-gradient(600px 400px at 0% 0%, #ebe9ff 0%, transparent 60%), var(--bg); min-height: 100vh; }

  .timebar { position: sticky; top: 0; z-index: 5; background: rgba(245,245,250,.92); backdrop-filter: blur(6px); }
  .timebar .bar { height: 5px; background: var(--accent-soft); }
  .timebar .bar div { height: 100%; background: var(--accent); width: 100%; border-radius: 0 99px 99px 0; transition: background .6s; }
  .timebar.ending .bar div { background: var(--amber); }
  .timebar.closed .bar div { background: var(--line); }

  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 18px 48px; }
  .top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .88rem; gap: 10px; min-height: 30px; }
  .top a { color: var(--accent-ink); text-decoration: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 99px; padding: 4px 12px;
          box-shadow: var(--shadow); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; white-space: nowrap; flex: none; }
  .pill.ending { color: #8a6114; }
  h1 { font-size: 1.4rem; line-height: 1.25; margin: 14px 0 6px; font-weight: 650; letter-spacing: -.01em; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0 0 18px; }

  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow);
          animation: rise .5s var(--ease) both; }
  .card:nth-child(2) { animation-delay: .06s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .card p { margin: 0 0 14px; }
  .options { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 8px; }
  .options button { font: inherit; font-weight: 600; font-size: 1.15rem; padding: 13px 0; border-radius: 12px;
                    border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
                    transition: background .25s, border-color .25s, color .25s, transform .15s; }
  .options button:active { transform: scale(.96); }
  .options button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  .options button:disabled { cursor: default; opacity: .55; }
  .options.list { grid-template-columns: 1fr; }
  .options.list button { display: flex; align-items: center; gap: 12px; text-align: left; font-size: 1rem; font-weight: 500;
                         padding: 14px 16px; line-height: 1.3; }
  .options.list button .letter { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
                                 background: var(--card); color: var(--accent-ink); font-weight: 650; font-size: .9rem;
                                 border: 1.5px solid var(--line); }
  .options.list button.sel .letter { background: #fff; border-color: #fff; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); font-size: .82rem; margin-top: 8px; }

  input[type=text] { width: 100%; font: inherit; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line);
                     background: var(--card); margin-bottom: 10px; color: var(--ink); transition: border-color .2s, box-shadow .2s; }
  input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  input[type=text]:disabled { opacity: .6; }
  .send { width: 100%; font: inherit; font-weight: 650; padding: 16px; border: 0; border-radius: 14px;
          background: var(--accent-ink); color: #fff; cursor: pointer; margin-top: 6px; transition: opacity .2s, transform .15s; }
  .send:active { transform: scale(.99); }
  .send:disabled { opacity: .35; cursor: default; }

  .status { display: flex; gap: 12px; align-items: flex-start; border-radius: 14px; padding: 14px 16px; margin-top: 14px;
            animation: rise .45s var(--ease) both; }
  .status.ok { background: var(--calm-soft); color: #1d6b61; }
  .status.err { background: #fbecea; color: var(--err); }
  .status.end { background: var(--accent-soft); color: var(--accent-ink); }
  .status .icon { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: .9rem; }
  .status.ok .icon { background: var(--calm); animation: pop .5s var(--ease); }
  .status.err .icon { background: var(--err); }
  .status.end .icon { background: var(--accent-ink); }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } }

  .waiting { text-align: center; padding: 34px 20px; }
  .waiting .dot { width: 14px; height: 14px; margin: 0 auto 16px; border-radius: 50%; background: var(--accent);
                  animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(109,102,240,.35); } 50% { box-shadow: 0 0 0 16px rgba(109,102,240,0); } }
  .waiting b { display: block; font-size: 1.15rem; margin-bottom: 4px; }
  .waiting span { color: var(--muted); }
  .offline { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 8px; font-size: .85rem; background: #fff6e0; color: #6b5200; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="timebar" id="timebar" hidden><div class="bar"><div id="timefill"></div></div></div>
<div class="wrap" id="wrap"><div class="card waiting"><div class="dot"></div><span data-i18n="vote.connecting"></span></div></div>
<div class="offline" id="offline" hidden data-i18n="vote.offline"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Internationalization: texts come from /i18n.json (static/i18n/<lang>.json) ---------- */
let M = {};
const t = (k, p = {}) => (M[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => p[x] ?? "");
async function loadI18n() {
  try { M = await (await fetch("/i18n.json")).json(); } catch (e) {}
  document.documentElement.lang = M._lang || "en";
  document.title = t("vote.title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
}

const newId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const voter = (() => {
  try {
    let v = localStorage.getItem("together-id");
    if (!v) { v = newId(); localStorage.setItem("together-id", v); }
    return v;
  } catch (e) { return newId(); }
})();
const readName = () => { try { return localStorage.getItem("together-name") || ""; } catch (e) { return ""; } };
let name = readName();
let currentId = null, last = null, closed = false, sent = false;
let localEnd = null, duration = 0;

function status(kind, text) {
  const m = $("msg");
  if (!m) return;
  const icon = {ok: "✓", err: "!", end: "✓"}[kind] || "";
  m.innerHTML = text ? `<div class="status ${kind}"><div class="icon">${icon}</div><div>${text}</div></div>` : "";
}

async function send(id, answer) {
  try {
    const res = await fetch("/api/answer", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({v: voter, name, id, answer})
    });
    const d = await res.json();
    if (res.ok) {
      sent = true;
      status("ok", t("vote.recorded", {name: esc(name.split(" ")[0])}));
      $("bSend").textContent = t($("bSend").dataset.kind === "words" ? "vote.update_words" : "vote.update_answer");
    } else status("err", esc(d.error || t("vote.could_not_send")));
  } catch (e) { status("err", esc(t("vote.could_not_send_network"))); }
}

function renderScale(s, prev) {
  const lo = s.min ?? 1, hi = s.max ?? 5, values = [];
  for (let x = lo; x <= hi; x++) values.push(x);
  const sel = prev ? [...prev] : s.statements.map(() => null);
  $("hint").textContent = t("vote.scale_hint", {min: lo, max: hi});
  $("body").innerHTML = s.statements.map((st, i) => `
    <div class="card"><p>${esc(st.text)}</p>
      <div class="options" style="--n:${values.length}" role="radiogroup">
        ${values.map(x => `<button type="button" role="radio" aria-checked="${sel[i] === x}" data-i="${i}" data-x="${x}" class="${sel[i] === x ? "sel" : ""}">${x}</button>`).join("")}
      </div>
      <div class="ends"><span>${lo} · ${esc(s.min_label || "")}</span><span>${esc(s.max_label || "")} · ${hi}</span></div>
    </div>`).join("") +
    `<button class="send" id="bSend">${esc(t(prev ? "vote.update_answer" : "vote.send_answer"))}</button><div id="msg"></div>`;
  const ready = () => $("bSend").disabled = closed || sel.some(v => v === null);
  $("body").querySelectorAll(".options button").forEach(b => b.onclick = () => {
    if (closed) return;
    sel[+b.dataset.i] = +b.dataset.x;
    b.parentElement.querySelectorAll("button").forEach(o => { o.classList.toggle("sel", o === b); o.setAttribute("aria-checked", o === b); });
    ready();
  });
  $("bSend").onclick = () => send(s.id, sel);
  ready();
  if (prev) status("ok", esc(t("vote.already_answered")));
}

function renderChoice(s, prev) {
  let sel = typeof prev === "number" ? prev : null;
  $("hint").textContent = s.hint || t("choice.default_hint");
  $("body").innerHTML = `<div class="card"><div class="options list" role="radiogroup">
      ${s.options.map((o, i) => `<button type="button" role="radio" aria-checked="${sel === i}" data-i="${i}" class="${sel === i ? "sel" : ""}">
        <span class="letter">${String.fromCharCode(65 + i)}</span><span>${esc(o)}</span></button>`).join("")}
    </div></div>
    <button class="send" id="bSend">${esc(t(prev != null ? "vote.update_answer" : "vote.send_answer"))}</button><div id="msg"></div>`;
  const ready = () => $("bSend").disabled = closed || sel === null;
  $("body").querySelectorAll(".list button").forEach(b => b.onclick = () => {
    if (closed) return;
    sel = +b.dataset.i;
    b.parentElement.querySelectorAll("button").forEach(o => { o.classList.toggle("sel", o === b); o.setAttribute("aria-checked", o === b); });
    ready();
  });
  $("bSend").onclick = () => send(s.id, sel);
  ready();
  if (prev != null) status("ok", esc(t("vote.already_answered")));
}

function renderCloud(s, prev) {
  const n = s.max_words ?? 3;
  $("hint").textContent = t("vote.cloud_hint", {n});
  let fields = "";
  for (let i = 0; i < n; i++)
    fields += `<input type="text" maxlength="30" autocomplete="off" autocapitalize="none" placeholder="${esc(t("vote.word_n", {n: i + 1}))}" value="${esc(prev?.[i] || "")}">`;
  $("body").innerHTML = `<div class="card">${fields}</div>
    <button class="send" id="bSend" data-kind="words">${esc(t(prev ? "vote.update_words" : "vote.send_words"))}</button><div id="msg"></div>`;
  $("bSend").onclick = () => {
    const words = [...$("body").querySelectorAll("input")].map(i => i.value.trim()).filter(Boolean);
    if (!words.length) return status("err", esc(t("vote.min_one_word")));
    send(s.id, words);
  };
  if (prev) status("ok", esc(t("vote.already_sent_words")));
}

function askName() {
  $("timebar").hidden = true;
  $("wrap").innerHTML = `<div class="card" style="margin-top:12px">
    <h1 style="margin-top:0">${esc(t("vote.hello"))}</h1>
    <p class="hint">${esc(t("vote.name_hint"))}</p>
    <form id="fName">
      <input type="text" id="iName" maxlength="60" autocomplete="name" placeholder="${esc(t("vote.full_name"))}" value="${esc(name)}" required>
      <button class="send" id="bName">${esc(t("vote.start"))}</button>
    </form></div>`;
  const i = $("iName"), b = $("bName");
  const ready = () => b.disabled = i.value.trim().length < 2;
  i.oninput = ready; ready(); i.focus();
  $("fName").onsubmit = e => {
    e.preventDefault();
    name = i.value.replace(/\s+/g, " ").trim();
    try { localStorage.setItem("together-name", name); } catch (err) {}
    currentId = null;
    if (last) render(last);
  };
}

function render(d) {
  if (!name) return askName();
  const s = d.slide;
  sent = d.my_answer != null;
  const kicker = s.type === "content" ? "" : esc(t("vote.question_of", {n: d.question, total: d.questions}));
  $("wrap").innerHTML = `<div class="top"><span>${kicker ? kicker + " · " : ""}${esc(name.split(" ")[0])}
      · <a href="#" id="change">${esc(t("vote.change"))}</a></span><span class="pill" id="pill" hidden></span></div>
    <h1>${esc(s.title)}</h1><p class="hint" id="hint"></p><div id="body"></div>`;
  $("change").onclick = e => { e.preventDefault(); askName(); };
  closed = d.closed;
  if (s.type === "scale") renderScale(s, d.my_answer);
  else if (s.type === "wordcloud") renderCloud(s, d.my_answer);
  else if (s.type === "choice") renderChoice(s, d.my_answer);
  else {
    $("hint").hidden = true;
    $("body").innerHTML = `<div class="card waiting"><div class="dot"></div>
      <b>${esc(t("vote.connected_as", {name: name.split(" ")[0]}))}</b>
      <span>${esc(t("vote.next_soon"))}</span></div>`;
  }
  applyClosed();
}

function applyClosed() {
  const body = $("body");
  if (!body) return;
  body.querySelectorAll("button:not(#bSend), input").forEach(el => el.disabled = closed);
  const b = $("bSend");
  if (b) {
    b.hidden = closed;
    if (!closed) b.disabled = b.dataset.kind === "words" ? false : !!body.querySelector(".options") &&
      [...body.querySelectorAll(".options")].some(g => !g.querySelector(".sel"));
  }
  if (closed && last && last.slide.type !== "content")
    status("end", t(sent ? "vote.time_up_saved" : "vote.time_up_wait"));
}

function tick() {
  const t = $("timebar"), pill = $("pill");
  if (localEnd != null && duration && name && last?.slide.type !== "content") {
    const left = Math.max(0, (localEnd - performance.now()) / 1000);
    t.hidden = false;
    $("timefill").style.width = (left / duration * 100) + "%";
    t.classList.toggle("ending", left <= 5 && left > 0);
    t.classList.toggle("closed", left === 0);
    if (pill) {
      pill.hidden = false;
      pill.textContent = left > 0 ? `⏱ ${Math.ceil(left)} s` : t("vote.time_up");
      pill.classList.toggle("ending", left <= 5 && left > 0);
    }
    if (left === 0 && !closed) { closed = true; applyClosed(); }
  } else {
    t.hidden = true;
    if (pill) pill.hidden = true;
  }
  requestAnimationFrame(tick);
}

async function refresh() {
  try {
    const res = await fetch(`/api/state?v=${encodeURIComponent(voter)}&n=${encodeURIComponent(name)}`);
    const d = await res.json();
    $("offline").hidden = true;
    last = d;
    duration = d.duration;
    if (d.remaining == null) localEnd = null;
    else {
      const end = performance.now() + d.remaining * 1000;
      if (localEnd == null || Math.abs(end - localEnd) > 400) localEnd = end;
    }
    if (d.slide.id !== currentId) {
      if ($("fName")) return;  // don't interrupt someone who is typing their name
      currentId = d.slide.id;
      render(d);
    } else if (d.closed !== closed) {  // the teacher restarted or extended the timer
      closed = d.closed;
      if (!closed) status("", "");
      applyClosed();
    }
  } catch (e) { $("offline").hidden = false; }
}
loadI18n().then(() => {
  refresh();
  setInterval(refresh, 1500);
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
