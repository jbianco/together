<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Together · Presenter</title>
<style>
  :root {
    --bg: #f5f5fa; --card: #ffffff; --ink: #25233b; --muted: #6f6d86; --line: #e7e6f0;
    --accent: #6d66f0; --accent-ink: #3f38c4; --accent-soft: #eeedff;
    --calm: #2a9d8f; --calm-soft: #e2f3f0; --amber: #d9a03a; --ghost: #9a98ad;
    --shadow: 0 1px 2px rgba(37, 35, 59, .04), 0 10px 30px rgba(37, 35, 59, .06);
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 600px at 8% -10%, #ebe9ff 0%, transparent 60%),
      radial-gradient(800px 600px at 105% 110%, #e1f3ef 0%, transparent 55%),
      var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }

  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 44px 0; gap: 24px; min-height: 92px; }
  .brand { display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 600; letter-spacing: .01em; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
  .join { display: flex; align-items: center; gap: 14px; background: var(--card); padding: 8px 18px 8px 8px;
          border-radius: 16px; box-shadow: var(--shadow); }
  .join img { width: 76px; height: 76px; display: block; border-radius: 8px; }
  .join .sub { color: var(--muted); font-size: .85rem; }
  .join .url { font-size: 1.15rem; font-weight: 650; overflow-wrap: anywhere; max-width: 380px; }

  main { flex: 1; min-height: 0; padding: 12px 44px 8px; display: flex; }
  .slide { flex: 1; min-height: 0; display: flex; flex-direction: column; background: rgba(255,255,255,.72);
           border: 1px solid rgba(231,230,240,.9); border-radius: 28px; box-shadow: var(--shadow);
           padding: 32px 44px 28px; backdrop-filter: blur(6px); }
  .slide.enter { animation: enter .6s var(--ease) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } }

  .heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 32px; }
  .kicker { color: var(--accent-ink); font-weight: 600; font-size: 1rem; letter-spacing: .04em; text-transform: uppercase; opacity: .8; }
  h1 { font-size: clamp(1.8rem, 2.8vw, 2.9rem); line-height: 1.18; margin: 6px 0 0; font-weight: 650; letter-spacing: -.015em; text-wrap: balance; }

  /* Timer */
  .timer { position: relative; width: 96px; height: 96px; flex: none; }
  .timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer .track { fill: none; stroke: var(--accent-soft); stroke-width: 7; }
  .timer .arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke .6s, stroke-dashoffset .3s; }
  .timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.9rem; font-weight: 650;
                font-variant-numeric: tabular-nums; color: var(--ink); }
  .timer .num small { display: block; font-size: .7rem; font-weight: 500; color: var(--muted); margin-top: -6px; text-align: center; }
  .timer.ending .arc { stroke: var(--amber); }
  .timer.done .arc { stroke: var(--calm); }
  .timer.done .num { color: var(--calm); }
  .timer.done { animation: beat .9s var(--ease); }
  @keyframes beat { 40% { transform: scale(1.08); } }

  /* Participation */
  .participation { display: flex; align-items: center; gap: 16px; margin: 22px 0 6px; color: var(--muted); font-size: 1.05rem; }
  .participation .pbar { flex: 1; height: 8px; background: var(--accent-soft); border-radius: 99px; overflow: hidden; max-width: 520px; }
  .participation .pbar div { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .8s var(--ease), background .6s; }
  .participation b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 650; }
  .participation.complete .pbar div { background: var(--calm); }
  .participation.complete b { color: var(--calm); }

  #body { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 14px; }

  /* While answering */
  .waiting { flex: 1; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .prompt { display: flex; gap: 16px; align-items: baseline; background: var(--card); border-radius: 16px; padding: 18px 22px;
            font-size: clamp(1.15rem, 1.6vw, 1.55rem); line-height: 1.35; box-shadow: 0 1px 2px rgba(37,35,59,.04); }
  .prompt span { color: var(--accent-ink); font-weight: 650; }
  .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 10px 14px; }
  .option-grid .prompt { padding: 13px 18px; font-size: clamp(1.05rem, 1.4vw, 1.35rem); }
  .note { color: var(--muted); font-size: 1.05rem; margin: 4px 0 0; }
  .who { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .who span { background: var(--accent-soft); color: var(--accent-ink); padding: 5px 12px; border-radius: 99px; font-size: .95rem;
              animation: appear .5s var(--ease) both; }
  .who .more { background: transparent; color: var(--muted); }
  @keyframes appear { from { opacity: 0; transform: scale(.9); } }

  /* Charts */
  .stmts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 24px 48px; flex: 1; min-height: 0; }
  .stmt { display: flex; flex-direction: column; min-height: 0; }
  .stmt-text { font-size: clamp(1.05rem, 1.45vw, 1.45rem); line-height: 1.32; min-height: 3.96em; }
  .stmt-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .95rem;
               margin: 4px 0 2px; gap: 12px; flex-wrap: wrap; }
  .legend { display: flex; gap: 18px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .chart { width: 100%; height: min(30vh, 300px); display: block; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 15px; font-family: inherit; }
  .chart .x-value { fill: var(--ink); font-size: 17px; }
  .chart .lbl { fill: var(--ink); font-weight: 650; font-size: 17px; }
  .chart .axis { stroke: var(--line); stroke-width: 1; }
  .chart .bar { fill: var(--accent); fill-opacity: .85; transform-box: fill-box; transform-origin: bottom; }
  .chart .hit:hover { fill: rgba(109,102,240,.06); }
  .chart .curve { fill: none; stroke: var(--accent-ink); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart .area { fill: var(--accent); fill-opacity: .08; }
  .chart .curve-before { fill: none; stroke: var(--ghost); stroke-width: 2.5; stroke-dasharray: 7 6; }
  .chart .empty-svg { fill: var(--muted); font-size: 18px; }
  .reveal .bar { animation: grow .9s var(--ease) both; }
  .reveal .curve { stroke-dasharray: 1; animation: draw 1.4s .35s var(--ease) both; }
  .reveal .area, .reveal .curve-before, .reveal .lbl { animation: fade 1s .6s both; }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* Single choice */
  .opts { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 1100px; }
  .opt { display: grid; grid-template-columns: minmax(220px, 34%) 1fr; gap: 20px; align-items: center; }
  .opt-text { font-size: clamp(1.05rem, 1.4vw, 1.35rem); line-height: 1.3; }
  .opt-track { position: relative; height: 40px; background: var(--accent-soft); border-radius: 10px; }
  .opt-bar { position: absolute; inset: 0 auto 0 0; background: var(--accent); opacity: .85; border-radius: 10px;
             transform-origin: left; transition: width .8s var(--ease); }
  .opt.max .opt-bar { background: var(--accent-ink); opacity: 1; }
  .opt-num { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 650; font-variant-numeric: tabular-nums;
             white-space: nowrap; font-size: 1.05rem; color: var(--ink); }
  .opt-num small { font-weight: 500; color: var(--muted); margin-left: 6px; }
  .reveal .opt-bar { animation: growX .9s var(--ease) both; }
  .reveal .opt-num { animation: fade .8s .5s both; }
  @keyframes growX { from { transform: scaleX(0); } }

  /* Word cloud */
  .cloud { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; align-content: center; align-items: center; gap: 6px 30px; padding: 12px; }
  .cloud span { font-weight: 650; line-height: 1.1; letter-spacing: -.01em; }
  .reveal .cloud span { animation: appear .7s var(--ease) both; }

  /* Cover */
  .cover { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .cover h1 { font-size: clamp(2.2rem, 3.6vw, 3.6rem); }
  .cover .text { font-size: clamp(1.1rem, 1.6vw, 1.5rem); color: var(--muted); margin: 6px 0 22px; }
  .cover .big { display: flex; align-items: center; gap: 36px; background: var(--card); padding: 22px 40px 22px 22px;
                border-radius: 24px; box-shadow: var(--shadow); }
  .cover .big img { width: min(32vh, 300px); height: min(32vh, 300px); }
  .cover .big .url { font-size: clamp(1.3rem, 2vw, 2.1rem); font-weight: 650; text-align: left; overflow-wrap: anywhere; max-width: 520px; }
  .cover .big .sub { font-size: 1.1rem; color: var(--muted); text-align: left; margin-bottom: 6px; }
  .cover .connected { margin-top: 18px; color: var(--muted); font-size: 1.1rem; }
  .cover .connected b { color: var(--accent-ink); font-size: 1.4rem; }
  .cover .started { color: var(--muted); font-size: .95rem; margin-top: 2px; }

  footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 44px 16px; color: var(--muted); gap: 16px; font-size: .95rem; }
  footer #info { white-space: nowrap; }
  footer .buttons { display: flex; gap: 2px; justify-content: flex-end; white-space: nowrap; }
  button { font: inherit; font-size: .92rem; border: 1px solid transparent; background: transparent; color: var(--muted);
           border-radius: 10px; padding: 7px 10px; cursor: pointer; transition: background .2s, color .2s; }
  button:hover { background: var(--card); color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .35; cursor: default; background: transparent; border-color: transparent; }
  button.primary { background: var(--accent-ink); color: #fff; }
  button.primary:hover { background: #352fae; color: #fff; }
  kbd { font: inherit; font-size: .75rem; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-left: 6px; color: var(--muted); }
  button.primary kbd { color: #dcdaff; border-color: #6d66f0; }

  /* Toast and confetti */
  .toast { position: fixed; left: 50%; top: 26px; transform: translate(-50%, -160%); background: var(--card); color: var(--calm);
           padding: 14px 26px; border-radius: 99px; box-shadow: var(--shadow); font-weight: 650; font-size: 1.15rem;
           transition: transform .7s var(--ease), opacity .5s; z-index: 10; white-space: nowrap; opacity: 0; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast.time { color: var(--accent-ink); }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
  .error { margin: auto; max-width: 560px; text-align: center; font-size: 1.3rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span id="brand"></span></div>
  <div class="join" id="join" hidden>
    <img id="qrSmall" alt="" data-i18n-alt="presenter.qr_alt">
    <div><div class="sub" data-i18n="presenter.join_at"></div><div class="url" id="urlSmall"></div></div>
  </div>
</header>
<main><section class="slide" id="slide"></section></main>
<footer>
  <div id="info"></div>
  <div class="buttons">
    <button id="bCopy"><span id="copyText" data-i18n="presenter.copy_link"></span></button>
    <button id="bTimer" data-i18n-title="presenter.restart_timer_tip"><span data-i18n="presenter.restart_timer"></span><kbd>T</kbd></button>
    <button id="bMore"><span data-i18n="presenter.add_time"></span><kbd>+</kbd></button>
    <button id="bReveal"><span id="revealText" data-i18n="presenter.show_results"></span><kbd>H</kbd></button>
    <button id="bClear"><span id="clearText" data-i18n="presenter.clear_answers"></span></button>
    <button id="bPrev"><span data-i18n="presenter.previous"></span><kbd>←</kbd></button>
    <button id="bNext" class="primary"><span data-i18n="presenter.next"></span><kbd>→</kbd></button>
  </div>
</footer>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<script>
const key = new URLSearchParams(location.search).get("k") || "";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Internationalization: texts come from /i18n.json (static/i18n/<lang>.json) ---------- */
let M = {}, pluralRules = new Intl.PluralRules("en");
const t = (k, p = {}) => (M[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => p[x] ?? "");
const tn = (k, n, p = {}) => t(`${k}_${pluralRules.select(n) === "one" ? "one" : "other"}`, {n, ...p});
async function loadI18n() {
  try { M = await (await fetch("/i18n.json")).json(); } catch (e) {}
  const lang = M._lang || "en";
  document.documentElement.lang = lang;
  pluralRules = new Intl.PluralRules(lang);
  document.title = t("presenter.title");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll("[data-i18n-alt]").forEach(el => el.alt = t(el.dataset.i18nAlt));
}
const COLORS = ["#4f48d6", "#2a9d8f", "#7a5af0", "#3b82c4", "#b4568f", "#5f6f2f", "#c27a2c"];
const R = 42, CIRC = 2 * Math.PI * R;

let data = null, slideId = null, bodyKey = "", wasVisible = false, celebrated = false, timeToastShown = false;
let localEnd = null;  // moment (performance.now) when time runs out

async function control(action) {
  const res = await fetch("/api/control?k=" + encodeURIComponent(key), {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action})
  });
  const r = await res.json().catch(() => ({}));
  if (action === "clear_all") toast(r.backup ? t("presenter.backup_saved", {file: r.backup}) : t("presenter.cleared_all"), true);
  else if (r.backup) toast(t("presenter.backup_saved", {file: r.backup}), true);
  refresh();
}

/* ---------- Distribution chart ---------- */
// Smooth curve: a sum of bell curves centered on each scale value, weighted by the % of answers.
function density(pcts, lo, t, h = 0.42) {
  return pcts.reduce((s, p, k) => s + p * Math.exp(-((t - (lo + k)) ** 2) / (2 * h * h)), 0);
}

function chart(d, x) {
  const lo = d.min ?? 1, hi = d.max ?? 5, k = hi - lo + 1;
  const W = 560, H = 270, L = 44, Rr = 10, T = 26, B = 52;
  const pw = W - L - Rr, ph = H - T - B, band = pw / k, width = Math.min(band * 0.56, 62);
  const toPct = dist => { const n = dist.reduce((a, b) => a + b, 0); return dist.map(c => n ? (c / n) * 100 : 0); };
  const pcts = toPct(x.distribution);
  const before = x.before_distribution && x.before_distribution.some(c => c) ? toPct(x.before_distribution) : null;
  const samples = [];
  for (let i = 0; i <= 80; i++) samples.push(lo - 0.5 + (k * i) / 80);
  const curve = p => samples.map(t => [t, density(p, lo, t)]);
  const cNow = x.n ? curve(pcts) : [], cBefore = before ? curve(before) : [];
  const top = Math.max(10, ...pcts, ...cNow.map(c => c[1]), ...cBefore.map(c => c[1]));
  const yMax = Math.ceil(top / 10) * 10;
  const sx = t => L + ((t - (lo - 0.5)) / k) * pw, sy = v => T + ph - (v / yMax) * ph;
  const line = pts => pts.map(([t, v], i) => `${i ? "L" : "M"}${sx(t).toFixed(1)},${sy(v).toFixed(1)}`).join("");
  const mode = x.n ? pcts.indexOf(Math.max(...pcts)) : -1;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(t("presenter.chart_label"))}">`;
  for (const g of [0, yMax / 2, yMax])
    svg += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${sy(g)}" y2="${sy(g)}"/>
            <text x="${L - 8}" y="${sy(g) + 5}" text-anchor="end">${g}%</text>`;
  pcts.forEach((p, i) => {
    const cx = sx(lo + i), h = Math.max((p / yMax) * ph, p ? 4 : 0), r = Math.min(4, h / 2);
    const x0 = cx - width / 2, y0 = T + ph - h;
    const tip = `${lo + i}: ${tn("presenter.answers", x.distribution[i])} (${Math.round(p)}%)` +
      (before ? ` · ${t("presenter.tip_before", {p: Math.round(before[i])})}` : "");
    svg += `<rect class="hit" x="${cx - band / 2}" y="${T}" width="${band}" height="${ph}" fill="transparent"><title>${tip}</title></rect>`;
    if (h) svg += `<path class="bar" pointer-events="none" style="animation-delay:${i * 70}ms"
      d="M${x0},${y0 + h}V${y0 + r}Q${x0},${y0} ${x0 + r},${y0}H${x0 + width - r}Q${x0 + width},${y0} ${x0 + width},${y0 + r}V${y0 + h}Z"/>`;
    if (i === mode) {  // label above the bar or the curve, whichever is higher
      const yl = Math.min(y0, sy(density(pcts, lo, lo + i))) - 10;
      svg += `<text class="lbl" x="${cx}" y="${yl}" text-anchor="middle">${Math.round(p)}%</text>`;
    }
    svg += `<text class="x-value" x="${cx}" y="${T + ph + 22}" text-anchor="middle">${lo + i}</text>`;
  });
  svg += `<text x="${sx(lo)}" y="${H - 6}" text-anchor="middle">${esc(d.min_label || "")}</text>
          <text x="${sx(hi)}" y="${H - 6}" text-anchor="middle">${esc(d.max_label || "")}</text>`;
  if (cBefore.length) svg += `<path class="curve-before" d="${line(cBefore)}"/>`;
  if (cNow.length) svg += `<path class="area" d="${line(cNow)}L${sx(hi + 0.5)},${sy(0)}L${sx(lo - 0.5)},${sy(0)}Z"/>
                           <path class="curve" pathLength="1" d="${line(cNow)}"/>`;
  else svg += `<text class="empty-svg" x="${L + pw / 2}" y="${T + ph / 2}" text-anchor="middle">${esc(t("presenter.no_answers"))}</text>`;
  return svg + `</svg>`;
}

function scale(s, r) {
  return `<div class="stmts">${s.statements.map((st, i) => {
    const x = r.statements[i];
    const hasBefore = x.before_distribution && x.before_distribution.some(c => c);
    const legend = hasBefore ? `<div class="legend">
        <span><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="var(--accent-ink)" stroke-width="2.5"/></svg>${esc(t("presenter.now"))}</span>
        <span><svg width="26" height="10"><line x1="0" x2="26" y1="5" y2="5" stroke="var(--ghost)" stroke-width="2.5" stroke-dasharray="7 6"/></svg>${esc(t("presenter.before_explanation"))}</span>
      </div>` : "";
    return `<div class="stmt">
      <div class="stmt-text">${esc(st.text)}</div>
      <div class="stmt-meta"><span>${tn("presenter.answers", x.n)}</span>${legend}</div>
      ${chart(s, x)}
    </div>`;
  }).join("")}</div>`;
}

function choice(s, r) {
  const max = Math.max(...r.counts), n = r.responses;
  return `<div class="opts">${s.options.map((o, i) => {
    const c = r.counts[i], pct = n ? (c / n) * 100 : 0;
    const inside = pct > 55;  // the number goes inside the bar when the bar is long
    return `<div class="opt${c && c === max ? " max" : ""}" title="${tn("presenter.answers", c)}">
      <div class="opt-text">${esc(o)}</div>
      <div class="opt-track"><div class="opt-bar" style="width:${pct}%;animation-delay:${i * 80}ms"></div>
        <div class="opt-num" style="${inside ? `right:calc(${100 - pct}% + 12px);color:#fff` : `left:calc(${pct}% + 12px)`}">
          ${Math.round(pct)}%<small style="${inside ? "color:#dcdaff" : ""}">${tn("presenter.people", c)}</small></div>
      </div></div>`;
  }).join("")}</div>`;
}

function cloud(r) {
  if (!r.words.length) return `<div class="waiting"><p class="note" style="text-align:center">${esc(t("presenter.no_words"))}</p></div>`;
  const max = r.words[0][1];
  const order = [];  // the most frequent words end up in the center
  r.words.forEach((w, i) => i % 2 ? order.push(w) : order.unshift(w));
  return `<div class="cloud">${order.map(([w, c], i) => {
    const size = 1.2 + 4.2 * Math.pow(c / max, 0.7);
    const color = COLORS[[...w].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COLORS.length];
    return `<span style="font-size:${size.toFixed(2)}rem;color:${color};animation-delay:${i * 40}ms" title="${c}">${esc(w)}</span>`;
  }).join("")}</div>`;
}

function waiting(s, d) {
  const who = d.who.slice(-36).map(n => `<span>${esc(n.split(" ")[0])}</span>`).join("");
  const more = d.who.length > 36 ? `<span class="more">${t("presenter.and_more", {n: d.who.length - 36})}</span>` : "";
  let prompt = "";
  if (s.type === "scale")
    prompt = s.statements.map((st, i) => `<div class="prompt"><span>${i + 1}</span>${esc(st.text)}</div>`).join("") +
      `<p class="note">${esc(t("presenter.scale_note", {min: s.min ?? 1, max: s.max ?? 5,
        min_label: s.min_label || "", max_label: s.max_label || ""}))}</p>`;
  else if (s.type === "choice")
    prompt = `<div class="option-grid">${s.options.map((o, i) =>
      `<div class="prompt"><span>${String.fromCharCode(65 + i)}</span>${esc(o)}</div>`).join("")}</div>` +
      `<p class="note">${esc(s.hint || t("choice.default_hint"))}</p>`;
  else prompt = `<p class="note" style="font-size:1.3rem">${esc(t("presenter.cloud_note", {n: s.max_words ?? 3}))}</p>`;
  return `<div class="waiting">${prompt}<div class="who">${who}${more}</div></div>`;
}

/* ---------- Render ---------- */
function shortUrl(u) { return u.replace(/^https?:\/\//, "").replace(/\/$/, ""); }

function buildSlide(d) {
  const s = d.slide, el = $("slide");
  el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
  if (s.type === "content") {
    el.innerHTML = `<div class="cover"><h1>${esc(s.title)}</h1>${s.text ? `<p class="text">${esc(s.text)}</p>` : ""}
      ${s.show_qr ? `<div class="big">${d.qr ? `<img id="qrBig" alt="${esc(t("presenter.qr_code"))}">` : ""}
        <div><div class="sub">${esc(t("presenter.scan_or_go"))}</div><div class="url" id="urlBig"></div></div></div>
        <div class="connected">${t("presenter.cover_connected", {n: '<b id="nConnected">0</b>'})}</div>` : ""}
      <div class="started" id="startedInfo"></div></div>`;
  } else {
    el.innerHTML = `<div class="heading">
        <div><div class="kicker">${esc(t("presenter.question_of", {n: d.question, total: d.questions}))}</div><h1>${esc(s.title)}</h1></div>
        <div class="timer" id="timer"${d.duration ? "" : " hidden"}>
          <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${R}"/>
            <circle class="arc" id="arc" cx="50" cy="50" r="${R}" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
          <div class="num"><div><span id="seconds"></span><small id="unit">${esc(t("presenter.sec"))}</small></div></div>
        </div>
      </div>
      <div class="participation" id="participation">
        <div class="pbar"><div id="pbar"></div></div><span id="ptext"></span>
      </div>
      <div id="body"></div>`;
  }
  bodyKey = ""; wasVisible = false; celebrated = false; timeToastShown = false;
}

function render(d) {
  const s = d.slide;
  $("brand").textContent = d.title;
  const qrSrc = "/qr.svg?u=" + encodeURIComponent(d.url);
  const cover = s.type === "content" && s.show_qr;
  $("join").hidden = cover;
  $("urlSmall").textContent = shortUrl(d.url);
  $("qrSmall").hidden = !d.qr;
  if (d.qr && $("qrSmall").getAttribute("src") !== qrSrc) $("qrSmall").src = qrSrc;

  if (s.id !== slideId) { slideId = s.id; buildSlide(d); }

  // Timer: re-sync with the server only when it drifts (avoids jumps).
  if (d.remaining == null) localEnd = null;
  else {
    const end = performance.now() + d.remaining * 1000;
    if (localEnd == null || Math.abs(end - localEnd) > 400) localEnd = end;
  }

  if (s.type === "content") {
    if ($("qrBig") && $("qrBig").getAttribute("src") !== qrSrc) $("qrBig").src = qrSrc;
    if ($("urlBig")) $("urlBig").textContent = shortUrl(d.url);
    if ($("nConnected")) $("nConnected").textContent = d.connected;
    $("startedInfo").textContent = d.started ? t("presenter.started_info", {
      date: new Date(d.started).toLocaleString(document.documentElement.lang, {dateStyle: "medium", timeStyle: "short"}),
      people: tn("presenter.respondents", d.respondents)}) : "";
  } else {
    if ($("timer")) $("timer").hidden = !d.duration;
    const complete = d.expected > 0 && d.answered >= d.expected;
    const pct = d.expected ? (d.answered / d.expected) * 100 : 0;
    $("pbar").style.width = pct + "%";
    $("participation").classList.toggle("complete", complete);
    $("ptext").innerHTML = complete
      ? `<b>${esc(t("presenter.everyone_answered"))}</b> (${d.answered})`
      : t("presenter.answered_of", {answered: `<b>${d.answered}</b>`, expected: `<b>${d.expected}</b>`});

    const visible = d.revealed || d.closed || complete;
    const k = JSON.stringify([visible, visible ? d.results : d.who]);
    if (k !== bodyKey) {
      bodyKey = k;
      let html;
      if (!visible) html = waiting(s, d);
      else if (s.type === "scale") html = scale(s, d.results);
      else if (s.type === "choice") html = choice(s, d.results);
      else html = cloud(d.results);
      $("body").innerHTML = html;
      $("body").classList.toggle("reveal", visible && !wasVisible);
      if (visible && !wasVisible) setTimeout(() => $("body") && $("body").classList.remove("reveal"), 2200);
      wasVisible = visible;
    }
    if (complete && !celebrated) { celebrated = true; $("timer")?.classList.add("done"); toast(t("presenter.toast_everyone")); confetti(); }
    if (!complete && celebrated) { celebrated = false; $("timer")?.classList.remove("done"); }
    if (d.closed && !complete && !timeToastShown) { timeToastShown = true; toast(t("presenter.toast_time"), true); }
    if (!d.closed) timeToastShown = false;
    $("revealText").textContent = t(d.revealed ? "presenter.hide_results" : "presenter.show_results");
  }
  const question = s.type !== "content";
  // Timer and results buttons only make sense on questions: hide them on the cover to keep the footer short.
  $("bTimer").hidden = $("bMore").hidden = $("bReveal").hidden = !question;
  $("bTimer").disabled = $("bMore").disabled = !d.duration;
  // On the cover (content slides) the button clears the whole questionnaire; on a question, only that slide.
  $("clearText").textContent = t(question ? "presenter.clear_answers" : "presenter.clear_all");
  $("bClear").disabled = !question && !d.respondents;
  $("info").textContent = `${d.index + 1} / ${d.total} · ${tn("presenter.connected", d.connected)}`;
  $("bPrev").disabled = d.index === 0;
  $("bNext").disabled = d.index === d.total - 1;
}

function tick() {
  const timer = $("timer");
  if (timer && localEnd != null && data) {
    const left = Math.max(0, (localEnd - performance.now()) / 1000);
    const done = timer.classList.contains("done");
    const frac = done ? 1 : data.duration ? left / data.duration : 0;
    $("arc").setAttribute("stroke-dashoffset", (CIRC * (1 - frac)).toFixed(1));
    $("seconds").textContent = done ? "✓" : Math.ceil(left);
    $("unit").textContent = t(done ? "presenter.done" : "presenter.sec");
    timer.classList.toggle("ending", left <= 5 && !done);
  }
  requestAnimationFrame(tick);
}

let toastTimer;
function toast(text, time) {
  const t = $("toast");
  t.textContent = text; t.classList.toggle("time", !!time); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

// Gentle confetti: few pieces, slow fall, palette colors.
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("confetti"), ctx = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const pieces = Array.from({length: 110}, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35,
    vx: (Math.random() - .5) * 9, vy: -Math.random() * 9 - 3, g: .16 + Math.random() * .08,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .2, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
    color: ["#6d66f0", "#2a9d8f", "#a5a0ff", "#8fd3c7", "#f2c46d"][Math.floor(Math.random() * 5)],
  }));
  const t0 = performance.now();
  (function frame(t) {
    const life = (t - t0) / 2600;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (life >= 1) return;
    for (const p of pieces) {
      p.vx *= .985; p.vy = p.vy * .985 + p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = 1 - life ** 2; ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    requestAnimationFrame(frame);
  })(t0);
}

async function refresh() {
  try {
    const res = await fetch("/api/presenter?k=" + encodeURIComponent(key));
    if (res.status === 403) {
      $("slide").innerHTML = `<div class="error">${esc(t("presenter.invalid_key"))}</div>`;
      return;
    }
    data = await res.json();
    render(data);
  } catch (e) {
    $("info").textContent = t("presenter.lost_connection");
  }
}

$("bNext").onclick = () => control("next");
$("bPrev").onclick = () => control("prev");
$("bReveal").onclick = () => control("reveal");
$("bTimer").onclick = () => control("restart_timer");
$("bMore").onclick = () => control("add_time");
$("bClear").onclick = () => {
  const all = data && data.slide.type === "content";
  if (confirm(t(all ? "presenter.clear_all_confirm" : "presenter.clear_confirm"))) control(all ? "clear_all" : "clear");
};
$("bCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(data.url); $("copyText").textContent = t("presenter.copied"); }
  catch (e) { prompt(t("presenter.copy_prompt"), data.url); }
  setTimeout(() => $("copyText").textContent = t("presenter.copy_link"), 1500);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const k = e.key.toLowerCase();
  if (["arrowright", "pagedown", " "].includes(k)) { e.preventDefault(); control("next"); }
  else if (["arrowleft", "pageup"].includes(k)) { e.preventDefault(); control("prev"); }
  else if (k === "h") control("reveal");
  else if (k === "t") control("restart_timer");
  else if (k === "+") control("add_time");
  else if (k === "f") document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
loadI18n().then(() => {
  refresh();
  setInterval(refresh, 1000);
  requestAnimationFrame(tick);
});
</script>
</body>
</html>
